# The planner checks that need no device, by hand only, when preparing a release.
# The full check, with the emulator, is run by hand before a release:
# tests/release-check.sh (see AGENTS.md, "Conventions").
name: planner checks

on:
  workflow_dispatch:

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/subsurface and, inside it, libdivecomputer.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The dependencies listed at the top of poc/build.sh.
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            libgit2-dev libxml2-dev libxslt1-dev libzip-dev libsqlite3-dev zlib1g-dev libssl-dev
      - name: Release check without a device
        run: bash tests/release-check.sh --ci
      - name: Report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-checks
          path: build/release-check/
          if-no-files-found: ignore
