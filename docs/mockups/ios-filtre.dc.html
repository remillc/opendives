<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Filtrer les plongées, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F2124}a:hover{color:#1F2124}
/* Source Sans 3 for body text, sized to match the system font (size-adjust 108%) */
@font-face{font-family:'Source Sans 3 OD';font-weight:400;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:500;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:600;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:700;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:800;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:900;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-900-normal.woff2) format('woff2')}
h1,h2,h3,h4,h1 *,h2 *,h3 *,h4 *,[style*='font-size: 2'],[style*='font-size: 3'],[style*='font-size: 4'],[style*='font-size: 2'] *,[style*='font-size: 3'] *,[style*='font-size: 4'] *{font-family:-apple-system, 'SF Pro Text', system-ui, sans-serif !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: 'Source Sans 3 OD', -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="padding: 54px 8px 0 8px; height: 98px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; background: #F9F9F7; border-bottom: 0.5px solid #DADAD6">
    <a href="Main.dc.html" style="font-size: 17px; text-decoration: none; color: #1F2124; min-height: 44px; display: flex; align-items: center; padding-left: 8px">Annuler</a>
    <span style="text-align: center; font-size: 17px; font-weight: 600">Filtrer</span>
    <button style="justify-self: end; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #1F2124; min-height: 44px; padding: 0 8px">Tout effacer</button>
  </div>

  <div style="padding: 12px 16px 0 16px">
    <label style="height: 36px; border-radius: 10px; background: #E8E8E5; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: #3C3C43">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #3C3C43; stroke-width: 2.2; stroke-linecap: round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20 20"></path></svg>
      <input type="search" placeholder="Chercher un critère" style="border: none; background: transparent; font-family: inherit; font-size: 17px; flex: 1; min-width: 0">
    </label>
  </div>

  <h2 style="margin: 18px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Mode de plongée</h2>
  <div role="radiogroup" aria-label="Mode de plongée" style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-radius: 9px; background: #E8E8E5; padding: 2px">
    <button role="radio" aria-checked="true" style="height: 40px; border: none; border-radius: 7px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">Tous</button>
    <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 7px; background: transparent; font-family: inherit; font-size: 15px">Circuit ouvert</button>
    <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 7px; background: transparent; font-family: inherit; font-size: 15px">Recycleur</button>
  </div>

  <h2 style="margin: 18px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Matériel</h2>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
    <sc-for list="{{gear}}" as="g" hint-placeholder-count="6">
      <button style="width: 100%; min-height: 48px; padding: 0 12px 0 16px; border: none; border-bottom: 0.5px solid #E8E8E5; background: {{g.bg}}; display: flex; align-items: center; gap: 8px; font-family: inherit; text-align: left">
        <span style="flex: 1; font-size: 17px; color: #000000">{{g.label}}</span>
        <span style="font-size: 17px; color: {{g.valueColor}}; font-weight: {{g.weight}}">{{g.value}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </sc-for>
  </div>

  <h2 style="margin: 18px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Autres critères</h2>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
    <sc-for list="{{groups}}" as="gr" hint-placeholder-count="5">
      <button aria-expanded="false" style="width: 100%; min-height: 52px; padding: 5px 12px 5px 16px; border: none; border-bottom: 0.5px solid #E8E8E5; background: transparent; display: flex; align-items: center; gap: 8px; font-family: inherit; text-align: left; box-sizing: border-box">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; color: #000000">{{gr.label}}</span>
          <span style="font-size: 13px; color: #3C3C43">{{gr.items}}</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 16px; background: #F9F9F7; border-top: 0.5px solid #DADAD6; display: flex; flex-direction: column; gap: 8px">
    <a href="ios-stats.dc.html" style="height: 50px; border-radius: 12px; background: #1F2124; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Afficher les 4 plongées</a>
    <button style="height: 36px; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #1F2124">Enregistrer ce filtre</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var gear = [
      ['Combinaison', 'Toutes'],
      ['Ordinateur', 'Suunto Vyper Air', true],
      ['Bouteille, type et taille', 'Toutes'],
      ['Gaz (oxygène, hélium)', 'Tous'],
      ['Autre matériel (étiquettes)', 'Tout']
    ].map(function (g) {
      return { label: g[0], value: g[1], bg: g[2] ? '#E8E8E5' : '#FFFFFF', valueColor: g[2] ? '#1F2124' : '#6B6B70', weight: g[2] ? 600 : 400 };
    });
    var groups = [
      { label: 'Quand', items: 'Date ou période, année, jour de la semaine, heure' },
      { label: 'Où', items: 'Site, pays et région, voyage' },
      { label: 'Avec qui', items: 'Compagnons, guide' },
      { label: 'La plongée', items: 'Profondeur max, durée, SAC, note, réelle ou planifiée' },
      { label: 'Conditions', items: 'Eau et air, visibilité, courant, houle, ressac, froid' },
      { label: 'Texte', items: 'Étiquettes, notes, recherche dans toute la fiche' }
    ];
    return { gear: gear, groups: groups };
  }
}
</script>
</body>
</html>
