<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier une plongée, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F2124}a:hover{color:#1F2124}
/* Source Sans 3 for body text, sized to match the system font (size-adjust 108%) */
@font-face{font-family:'Source Sans 3 OD';font-weight:400;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:500;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:600;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:700;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:800;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:900;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-900-normal.woff2) format('woff2')}
h1,h2,h3,h4,h1 *,h2 *,h3 *,h4 *,[style*='font-size: 2'],[style*='font-size: 3'],[style*='font-size: 4'],[style*='font-size: 2'] *,[style*='font-size: 3'] *,[style*='font-size: 4'] *{font-family:-apple-system, 'SF Pro Text', system-ui, sans-serif !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: 'Source Sans 3 OD', -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 8px 0 8px; height: 98px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; background: #F9F9F7; border-bottom: 0.5px solid #DADAD6">
    <button style="justify-self: start; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #1F2124; min-height: 44px; padding: 0 8px">Annuler</button>
    <span style="text-align: center; font-size: 17px; font-weight: 600">Modifier</span>
    <button style="justify-self: end; border: none; background: transparent; font-family: inherit; font-size: 17px; font-weight: 600; color: #1F2124; min-height: 44px; padding: 0 8px">OK</button>
  </div>

  <div style="flex: 1; overflow: hidden; padding-bottom: 16px">
    <h2 style="margin: 18px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Plongée</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
      <sc-for list="{{general}}" as="r" hint-placeholder-count="4">
        <a href="#champ" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5; gap: 12px; color: #000000; text-decoration: none">
          <span style="flex: 1; font-size: 17px">{{r.label}}</span>
          <span style="font-size: 17px; color: #3C3C43; font-variant-numeric: tabular-nums">{{r.value}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Compagnons</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px">
      <span style="height: 32px; padding: 0 6px 0 12px; border-radius: 16px; background: #E8E8E5; color: #1F2124; display: flex; align-items: center; gap: 4px; font-size: 15px">
        Michael
        <button aria-label="Retirer Michael" style="width: 28px; height: 28px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #1F2124; stroke-width: 2.4; stroke-linecap: round"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
        </button>
      </span>
      <button style="height: 32px; padding: 0 12px; border: 1px dashed #8E8E93; border-radius: 16px; background: transparent; color: #1F2124; font-family: inherit; font-size: 15px">Ajouter</button>
    </div>

    <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Équipement</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
      <div style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5; gap: 12px">
        <span id="mode-l" style="flex: 1; font-size: 17px">Mode</span>
        <div role="radiogroup" aria-labelledby="mode-l" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E8E8E5; border-radius: 9px; padding: 2px; width: 190px">
          <button role="radio" aria-checked="false" style="height: 30px; border: none; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px">Circuit ouvert</button>
          <button role="radio" aria-checked="true" style="height: 30px; border: none; border-radius: 7px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.15); font-family: inherit; font-size: 14px; font-weight: 600">Recycleur</button>
        </div>
      </div>
      <sc-for list="{{gear}}" as="r" hint-placeholder-count="2">
        <a href="#champ" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5; gap: 12px; color: #000000; text-decoration: none">
          <span style="flex: 1; font-size: 17px">{{r.label}}</span>
          <span style="font-size: 17px; color: #3C3C43">{{r.value}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Bouteilles</h2>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
      <sc-for list="{{cyl}}" as="c" hint-placeholder-count="3">
        <a href="#bouteille" style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5; gap: 12px; color: #000000; text-decoration: none">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; padding: 5px 0">
            <span style="font-size: 17px">{{c.name}}</span>
            <span style="font-size: 13px; color: #3C3C43">{{c.hint}}</span>
          </span>
          <span style="font-size: 15px; color: #3C3C43; font-variant-numeric: tabular-nums">{{c.press}}</span>
        </a>
      </sc-for>
      <button style="width: 100%; min-height: 44px; padding: 0 16px; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #1F2124; text-align: left">Ajouter une bouteille</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Plongée réelle de test42.xml (Lake Coleridge, 2 avril 2014).
class Component extends DCLogic {
  renderVals() {
    return {
      general: [
        { label: 'Date et heure', value: '2 avr. 2014, 10 h 00' },
        { label: 'Site', value: 'Lake Coleridge' },
        { label: 'Eau', value: '4,3 °C' },
        { label: 'Tags', value: 'ccr_dive' }
      ],
      gear: [
        { label: 'Combinaison', value: 'dry suit' },
        { label: 'Ordinateur', value: 'OSTC 3' }
      ],
      cyl: [
        { name: 'Dil2, 16 pi³', hint: 'Diluant, trimix 16/45', press: '2 683 à 1 885 psi' },
        { name: 'Oxy2, 16 pi³', hint: 'Oxygène', press: '2 756 à 1 885 psi' },
        { name: 'AL80, 80 pi³', hint: 'Secours, air', press: '3 002 à 2 901 psi' }
      ]
    };
  }
}
</script>
</body>
</html>
