<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Statistiques du résultat filtré, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F2124}a:hover{color:#1F2124}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <button aria-label="Menu" aria-haspopup="menu" style="position: absolute; left: 6px; top: 50px; z-index: 3; width: 44px; height: 44px; border: none; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #1F2124; stroke-width: 2.2; stroke-linecap: round"><path d="M4 7h16 M4 12h16 M4 17h16"></path></svg></button>
  <div style="padding: 98px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.4px">Statistiques</h1>
    <div style="background: #E8E8E5; border-radius: 12px; padding: 10px 8px 10px 14px; display: flex; align-items: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #1F2124; stroke-width: 1.9; stroke-linejoin: round"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"></path></svg>
      <a href="ios-filtre.dc.html" style="flex: 1; display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: #1F2124">
        <span style="font-size: 15px; font-weight: 600">Ordinateur : Suunto Vyper Air</span>
        <span style="font-size: 13px; color: #1F2124">4 plongées sur 9, touchez pour modifier</span>
      </a>
      <button aria-label="Enlever le filtre" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #1F2124; stroke-width: 2.2; stroke-linecap: round"><path d="M6 6l12 12 M18 6L6 18"></path></svg>
      </button>
    </div>
  </div>

  <dl style="margin: 16px 16px 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 12px 16px; border-bottom: 0.5px solid #E8E8E5">
      <dt style="font-size: 17px">Temps sous l’eau</dt>
      <dd style="margin: 0; font-size: 28px; font-weight: 700; color: #1F2124">4 h 07</dd>
    </div>
    <sc-for list="{{facts}}" as="f" hint-placeholder-count="5">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5">
        <dt style="font-size: 17px">{{f.label}}</dt>
        <dd style="margin: 0; font-size: 17px; color: #3C3C43">{{f.value}}</dd>
      </div>
    </sc-for>
  </dl>

  <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Profondeur maximale par plongée</h2>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; padding: 12px 12px 8px 12px">
    <svg width="342" height="150" viewBox="0 0 342 150" role="img" aria-label="Profondeur maximale des 4 plongées : 28,7 m, 22,0 m, 21,8 m, 22,4 m">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
        <rect x="{{b.x}}" y="{{b.y}}" width="56" height="{{b.h}}" rx="4" style="fill: {{b.fill}}"></rect>
        <text x="{{b.cx}}" y="{{b.ty}}" style="font-size: 13px; font-weight: 600; fill: #000000; text-anchor: middle; font-family: -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums">{{b.value}}</text>
        <text x="{{b.cx}}" y="146" style="font-size: 12px; fill: #3C3C43; text-anchor: middle; font-family: -apple-system, system-ui, sans-serif">{{b.label}}</text>
      </sc-for>
    </svg>
  </div>

  <div style="margin: 16px 16px 0 16px; background: #FFFFFF; border-radius: 10px; overflow: hidden">
    <button style="width: 100%; min-height: 48px; padding: 0 12px 0 16px; border: none; background: transparent; display: flex; align-items: center; gap: 8px; font-family: inherit; text-align: left">
      <span style="flex: 1; font-size: 17px; color: #000000">Comparer par combinaison</span>
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var DIVES = [['08:21', 28.7], ['10:53', 22.0], ['13:44', 21.8], ['16:14', 22.4]];
function mix(f) {
  var a = [0xFB, 0xE3, 0xB2], b = [0xB4, 0x53, 0x0F];
  f = Math.max(0, Math.min(1, f));
  return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(',') + ')';
}
class Component extends DCLogic {
  renderVals() {
    var top = 8, H = 96, dmax = 30;
    var bars = DIVES.map(function (d, i) {
      var h = d[1] / dmax * H, x = 14 + i * 84;
      return { x: x, y: top, h: h.toFixed(1), cx: x + 28, ty: (top + h + 16).toFixed(1), value: String(d[1]).replace('.', ',') + ' m', label: d[0], fill: mix(d[1] / 60) };
    });
    return {
      bars: bars,
      facts: [
        { label: 'Plongées', value: '4' },
        { label: 'Profondeur maximale', value: '28,7 m' },
        { label: 'Moyenne des maximales', value: '23,7 m' },
        { label: 'Consommation moyenne (SAC)', value: '10,7 l/min' },
        { label: 'Eau', value: '25 à 26 °C' }
      ]
    };
  }
}
</script>
</body>
</html>
