<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function hx(h) { return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
function mix(f) {
  var a = hx('#FBE3B2'), b = hx('#B4530F');
  f = Math.max(0, Math.min(1, f));
  return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(',') + ')';
}
function prof(pts, W, H, top) {
  top = top || 0;
  var t1 = pts[pts.length - 1][0], maxD = 0;
  pts.forEach(function (p) { if (p[1] > maxD) maxD = p[1]; });
  var line = 'M' + pts.map(function (p) { return (p[0] / t1 * W).toFixed(1) + ' ' + (top + p[1] / maxD * (H - top - 2)).toFixed(1); }).join(' L');
  return { line: line, area: line + ' L' + W + ' 0 L0 0 Z', bottom: mix(maxD / 60) };
}

class Component extends DCLogic {
  renderVals() {
    var h = prof(P.d9, 358, 130, 6);
