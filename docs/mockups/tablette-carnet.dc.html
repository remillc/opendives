    <sc-for list="{{dives}}" as="d" hint-placeholder-count="5">

          <path d="{{d.area}}" style="fill: url(#{{d.gid}}); stroke: none"></path>
          <path d="{{d.line}}" style="fill: none; stroke: #1F2124; stroke-width: 1.25; vector-effect: non-scaling-stroke"></path>

        <text x="32" y="{{tk.ty}}" style="font-size: 12px; fill: #3C3C43; text-anchor: end; font-family: 'Source Sans 3 OD', -apple-system, system-ui, sans-serif">{{tk.label}}</text>

      <path d="{{area}}" style="fill: url(#water-d7); stroke: none"></path>
      <path d="{{line}}" style="fill: none; stroke: #1F2124; stroke-width: 2; stroke-linejoin: round"></path>
      <sc-for list="{{xTicks}}" as="tx" hint-placeholder-count="5">

          <dt style="font-size: 13px; color: #3C3C43">{{f.label}}</dt>
          <dd style="margin: 0; font-size: 17px">{{f.value}}</dd>
        </div>
      </sc-for>
    </dl>
  </section>
</div>

function mix(f) {

  f = Math.max(0, Math.min(1, f));
  return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(',') + ')';
}
