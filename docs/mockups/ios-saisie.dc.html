<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisie rapide, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1F2124}a:hover{color:#1F2124}
/* Source Sans 3 for body text, sized to match the system font (size-adjust 108%) */
@font-face{font-family:'Source Sans 3 OD';font-weight:400;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:500;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:600;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:700;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:800;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3 OD';font-weight:900;font-style:normal;font-display:block;size-adjust:108%;ascent-override:85.9%;descent-override:22.6%;line-gap-override:0%;src:url(../brand/fonts/source-sans-3-latin-900-normal.woff2) format('woff2')}
h1,h2,h3,h4,h1 *,h2 *,h3 *,h4 *,[style*='font-size: 2'],[style*='font-size: 3'],[style*='font-size: 4'],[style*='font-size: 2'] *,[style*='font-size: 3'] *,[style*='font-size: 4'] *{font-family:-apple-system, 'SF Pro Text', system-ui, sans-serif !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: 'Source Sans 3 OD', -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 8px 0 8px; height: 98px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; background: #F9F9F7; border-bottom: 0.5px solid #DADAD6">
    <a href="Main.dc.html" style="font-size: 17px; text-decoration: none; color: #1F2124; min-height: 44px; display: flex; align-items: center; padding-left: 8px">Plus tard</a>
    <span style="text-align: center; font-size: 17px; font-weight: 600">Compléter</span>
    <a href="Main.dc.html" style="justify-self: end; font-size: 17px; font-weight: 600; text-decoration: none; color: #1F2124; min-height: 44px; display: flex; align-items: center; padding-right: 8px">Enregistrer</a>
  </div>

  <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <svg width="56" height="36" viewBox="0 0 56 36" preserveAspectRatio="none" role="img" aria-label="Profil, 91 pi au plus profond" style="flex: none; border-radius: 4px; background: #FFFFFF">
      <defs><linearGradient id="qs-d9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: #D4E2F2"></stop><stop offset="1" style="stop-color: {{bottom}}"></stop></linearGradient></defs>
      <path d="{{area}}" style="fill: url(#qs-d9); stroke: none"></path>
      <path d="{{line}}" style="fill: none; stroke: #1F2124; stroke-width: 1.25; vector-effect: non-scaling-stroke"></path>
    </svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 600">Plongée du 7 février 2026, 9 h 09</span>
      <span style="font-size: 13px; color: #3C3C43; font-variant-numeric: tabular-nums">91 pi au plus profond, 55 min</span>
    </span>
  </div>

  <h2 style="margin: 4px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Site</h2>
  <fieldset style="margin: 0 16px; padding: 0; border: none; background: #FFFFFF; border-radius: 10px; overflow: hidden">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Choisir le site</legend>
    <button style="width: 100%; min-height: 52px; padding: 0 16px; border: none; border-bottom: 0.5px solid #E8E8E5; background: transparent; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 17px; color: #1F2124; text-align: left">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #1F2124; stroke-width: 1.8; stroke-linejoin: round"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
      Créer un site à ma position actuelle
    </button>
    <sc-for list="{{sites}}" as="s" hint-placeholder-count="3">
      <label style="min-height: 52px; padding: 0 16px; border-bottom: 0.5px solid #E8E8E5; display: flex; align-items: center; gap: 12px; box-sizing: border-box">
        <input type="radio" name="site" style="width: 22px; height: 22px; margin: 0; accent-color: #1F2124">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 17px">{{s.name}}</span>
          <span style="font-size: 13px; color: #3C3C43">{{s.hint}}</span>
        </span>
      </label>
    </sc-for>
    <button style="width: 100%; min-height: 52px; padding: 0 16px; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #1F2124; text-align: left">Chercher un autre site</button>
  </fieldset>

  <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Compagnons</h2>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; padding: 0 16px">
    <label style="min-height: 52px; display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #6B6B70; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"></path></svg>
      <input type="text" placeholder="Ajouter un compagnon" style="border: none; flex: 1; min-width: 0; font-family: inherit; font-size: 17px; background: transparent">
    </label>
  </div>
  <p style="margin: 6px 32px 0 32px; font-size: 13px; line-height: 18px; color: #3C3C43">Vos compagnons seront ensuite proposés en un toucher.</p>

  <h2 style="margin: 20px 16px 6px 32px; font-size: 13px; font-weight: 400; color: #3C3C43">Note</h2>
  <div role="radiogroup" aria-label="Note de la plongée" style="margin: 0 16px; background: #FFFFFF; border-radius: 10px; padding: 4px 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0">
    <sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
      <button role="radio" aria-checked="false" aria-label="{{st.label}}" style="height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #8E8E93; stroke-width: 1.6; stroke-linejoin: round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"></path></svg>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var PTS = [[10,0.0],[110,7.3],[210,14.4],[310,20.9],[410,25.0],[510,25.9],[610,25.3],[710,25.3],[810,24.8],[910,27.1],[1010,26.2],[1110,25.3],[1210,26.2],[1310,27.5],[1410,26.8],[1510,22.1],[1610,16.7],[1710,16.3],[1810,16.4],[1910,15.2],[2010,14.8],[2110,16.5],[2210,15.3],[2310,15.5],[2410,15.1],[2510,15.9],[2610,15.6],[2710,16.1],[2810,13.7],[2910,13.1],[3010,8.9],[3110,6.3],[3210,6.2],[3310,5.2],[3390,0.0]];
function mix(f) {
  var a = [0xD4, 0xE2, 0xF2], b = [0x55, 0x84, 0xB5];
  f = Math.max(0, Math.min(1, f));
  return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(',') + ')';
}
class Component extends DCLogic {
  renderVals() {
    var line = 'M' + PTS.map(function (p) { return (p[0] / 3390 * 56).toFixed(1) + ' ' + (p[1] / 27.6 * 34).toFixed(1); }).join(' L');
    return {
      line: line, area: line + ' L56 0 L0 0 Z', bottom: mix(27.6 / 60),
      sites: [
        { name: 'Northern Arch', hint: 'Dernière plongée le 24 avril 2022' },
        { name: 'Hälvälä', hint: 'Dernière plongée le 23 mai 2015' },
        { name: 'Lake Coleridge', hint: 'Dernière plongée le 2 avril 2014' }
      ],
      stars: [1, 2, 3, 4, 5].map(function (n) { return { label: n + (n > 1 ? ' étoiles' : ' étoile') }; })
    };
  }
}
</script>
</body>
</html>
