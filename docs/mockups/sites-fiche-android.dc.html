<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

function hx(h) { return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
function mix(f) { var a = hx('#FBE3B2'), b = hx('#B4530F'); f = Math.max(0, Math.min(1, f)); return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(',') + ')'; }
class Component extends DCLogic {
  renderVals() {
    var line = 'M' + PTS.map(function (p) { return (p[0] / 6240 * 56).toFixed(1) + ' ' + (2 + p[1] / 60.2 * 36).toFixed(1); }).join(' L');
    return { tl: line, ta: line + ' L56 0 L0 0 Z', tb: mix(60.2 / 60) };
  }
}
