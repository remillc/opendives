<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Positions réelles (fichiers d'exemple de Subsurface), projetées sur la zone visible.
var SITES = [
  { name: 'Northern Arch', lat: -35.4485, lon: 174.732 },
  { name: 'Lake Coleridge', lat: -43.342295, lon: 171.545936 }
];
function px(lon) { return Math.round((lon - 168) / 10 * 390); }
function py(lat) { return Math.round(205 + (-34 - lat) / 11 * 200); }
class Component extends DCLogic {
  renderVals() {
    return { pins: SITES.map(function (s) { var x = px(s.lon), y = py(s.lat); return { name: s.name, x: x, y: y, lx: x + 18, ly: y - 20, op: /cole/i.test(s.name) ? 1 : 0.3 }; }) };
  }
}
</script>
