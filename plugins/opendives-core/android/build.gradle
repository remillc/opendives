// Local Capacitor plugin OpenDivesCore. The native libraries and the sample
// asset are produced by native/build-android.sh in build/android/ (not versioned).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def nativeOut = new File(rootProject.projectDir, '../../build/android')

android {
    namespace 'org.opendives.core'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            jniLibs.srcDirs += new File(nativeOut, 'jniLibs')
            assets.srcDirs += new File(nativeOut, 'assets')
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
}
