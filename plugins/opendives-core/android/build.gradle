// Local Capacitor plugin OpenDivesCore. The native libraries and the sample
// asset are produced by native/build-android.sh in build/android/ (not versioned).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def nativeOut = new File(rootProject.projectDir, '../../build/android')

android {
    namespace 'org.opendives.core'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            jniLibs.srcDirs += new File(nativeOut, 'jniLibs')
            assets.srcDirs += new File(nativeOut, 'assets')
            // regions.txt: offline country and region (tools/build-regions.mjs).
            assets.srcDirs += new File(rootProject.projectDir, '../../core/data')
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // The plugin's activity (window flags, the system dialog that turns Bluetooth on).
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.activity:activity:${rootProject.ext.androidxActivityVersion}"
    // Offline map downloads: background work with a foreground notification.
    implementation "androidx.work:work-runtime:2.10.0"
    // The gauge camera (pressures read from a photo): the live preview and the still capture.
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    // Text recognition on the device (Latin), with its model inside the app: no download, no network.
    implementation "com.google.mlkit:text-recognition:16.0.1"
}
